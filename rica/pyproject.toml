[project]
name = "rica"
version = "0.1.0"
description = "RICA, a personal AI assistant (see ../RICA_PLAN.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "pydantic-settings>=2.15",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "tiktoken>=0.14",
    "python-frontmatter>=1.3",
    "pyyaml>=6",
    "tzdata",
    # Knowledge base (M3+)
    "langchain-text-splitters>=1.1",
    "langchain-classic>=1.0",
    "langchain-qdrant>=1.1",
    "qdrant-client>=1.19",
    "fastembed>=0.8",
    "pathspec>=1.1",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rica"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
