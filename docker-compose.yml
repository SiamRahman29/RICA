services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llamacpp
    restart: unless-stopped
    volumes:
      - /home/siam/models:/models:ro
    command: >
      --models-dir /models
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --threads 4
      --reasoning off
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - ai_network

  litellm:
    image: ghcr.io/berriai/litellm:v1.101.0
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - RICA_INTERNAL_KEY=${RICA_INTERNAL_KEY}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - llamacpp
    networks:
      - ai_network

  rica:
    build: ./rica
    image: rica:local
    container_name: rica
    restart: unless-stopped
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - RICA_INTERNAL_KEY=${RICA_INTERNAL_KEY}
      - OWNER_NAME=${OWNER_NAME:-}
      - TZ=${TZ:-Asia/Dhaka}
    volumes:
      # Filled by rica-ingest in M3; until then the profile falls back to OWNER_NAME
      - knowledge:/knowledge:ro
      - rica_data:/data
    depends_on:
      - litellm
    networks:
      - ai_network

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "3002:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - ENABLE_SIGNUP=false
      # Background tasks (titles, tags) use the cheap Groq model, not RICA
      - TASK_MODEL_EXTERNAL=groq-fast
      # Autocomplete would call a model while typing and burn free-tier quota
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - DEFAULT_MODELS=rica
    depends_on:
      - litellm
    networks:
      - ai_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "openwebui:8080"
    depends_on:
      - openwebui
    networks:
      - ai_network

volumes:
  openwebui_data:
  knowledge:
  rica_data:

networks:
  ai_network:
